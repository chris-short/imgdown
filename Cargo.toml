[package]
name = "imgdown"
version = "0.20260629.5"
edition = "2021"
repository = "https://github.com/chris-short/imgdown"
homepage = "https://github.com/chris-short/imgdown"
description = "Download images from URLs found in markdown files"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
regex = "1"
url = "2"
anyhow = "1"
walkdir = "2"
serde_json = "1"
serde_yml = "0"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
futures = "0.3"

[workspace]

[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["homebrew"]
tap = "chris-short/homebrew-imgdown"
publish-jobs = ["homebrew"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
allow-dirty = ["ci"]

[profile.dist]
inherits = "release"
lto = "thin"