[package]
name = "imgdown"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
regex = "1"
url = "2"
anyhow = "1"
walkdir = "2"
serde_json = "1"
serde_yml = "0"
toml = "1.1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"